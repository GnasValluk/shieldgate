name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build ShieldGate.exe
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File ./build.ps1

      - name: Run core self-test
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File ./test.ps1

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ShieldGate
          path: dist/ShieldGate.exe
